name: Build, test and publish distributions

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested artifacts to PyPI (configure trusted publisher first)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          check-latest: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  wheels:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          check-latest: true
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
      - name: Install and test the wheel on the minimum Python
        run: |
          python tests/check_distributions.py
          python -m pip install --force-reinstall dist/*.whl
          python -m pip install pytest jsonschema
          python tests/run_installed_tests.py
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          check-latest: true
      - name: Test the same ABI3 wheel on Python 3.14
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip install pytest jsonschema
          python tests/run_installed_tests.py
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          check-latest: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Build and test from the source distribution
        run: |
          python tests/check_distributions.py
          python tests/verify_sdist.py dist/*.tar.gz
          python -m pip wheel --no-deps --wheel-dir rebuilt dist/*.tar.gz
          python -m pip install rebuilt/*.whl pytest jsonschema
          python tests/run_installed_tests.py
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [wheels, sdist]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/orbifolder/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          check-latest: true
      - name: Validate metadata and tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python -m pip install twine packaging
          python -m twine check --strict dist/*
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.utils import parse_wheel_filename, parse_sdist_filename
          versions = set()
          for path in Path('dist').iterdir():
              parsed = parse_wheel_filename(path.name) if path.suffix == '.whl' else parse_sdist_filename(path.name)
              assert parsed[0] == 'orbifolder', parsed
              versions.add(str(parsed[1]))
          assert len(versions) == 1, versions
          if os.environ['IS_TAG'] == 'true':
              assert os.environ['RELEASE_TAG'] == 'v' + versions.pop()
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1
