[workspace]
members = ["crates/orbifolder-core", "crates/orbifolder-data", "crates/orbifolder-python"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
authors = ["Martin Wimmer"]
license = "GPL-3.0-or-later"
repository = "https://github.com/AlphaMegaladon/orbifolder"

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
overflow-checks = true
