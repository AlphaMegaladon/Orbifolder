[package]
name = "orbifolder-core"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Exact, immutable mathematical primitives for heterotic orbifolds"

[lints]
workspace = true

[features]
# Enabled by the bindings test binary to count builds across Rayon workers.
test-geometry-build-count = []

[dependencies]
num-bigint = "0.4.6"
num-integer = "0.1.46"
num-rational = "0.4.2"
num-traits = "0.2.19"
rayon = "1.11"

[dev-dependencies]
proptest = "1.6"
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10.9"
